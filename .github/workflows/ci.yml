name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-et-tests:
    name: Build et tests
    runs-on: ubuntu-latest
    env:
      # Les tests tournent sous happy-dom : pas besoin des navigateurs Playwright.
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Build (tsc + vite)
        run: npm run build

      - name: Tests (vitest)
        run: npm test
